<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CropVision - AI-Powered Plant Disease Detection & Smart Crop Health Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root">
      <div style="padding:40px;text-align:center;font-family:sans-serif;">
        <h1 style="font-size:24px;color:#059669;">Loading CropVision...</h1>
        <p style="color:#666;margin-top:10px;">If you see this, React hasn't mounted yet.</p>
      </div>
    </div>
    <script>
      window.onerror = function(msg, url, line, col, err) {
        document.getElementById('root').innerHTML = '<div style="padding:20px;font-family:monospace;background:#1e293b;color:#f87171;min-height:100vh;"><h2 style="color:#fbbf24;">JavaScript Error Detected:</h2><p>' + msg + '</p><pre>' + (err && err.stack || '') + '</pre></div>';
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
