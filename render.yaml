services:
  - type: web
    name: cropvision
    runtime: node
    plan: free
    buildCommand: npm ci && npx vite build
    startCommand: node server/server.js
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: NODE_ENV
        value: production
